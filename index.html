<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>МВД · Автопарк и форма</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0e1116;--bg2:#131820;--card:#191f28;--line:#27303d;--txt:#e9edf4;--mut:#8b95a7;--acc:#4da3ff;--green:#2fd97a;--yellow:#f7c948;--red:#ff5c5c}
html{color-scheme:dark}
body{background:radial-gradient(1100px 520px at 8% -10%,rgba(45,100,170,.17),transparent 60%),radial-gradient(900px 520px at 115% 115%,rgba(130,90,220,.11),transparent 55%),#0e1116;color:var(--txt);font-family:Inter,system-ui,'Segoe UI',Roboto,sans-serif;font-size:14px;min-height:100vh}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a3342;border-radius:8px;border:2px solid #131820}
::-webkit-scrollbar-thumb:hover{background:#3a4656}
#errbox{display:none;position:fixed;left:12px;top:12px;z-index:990;background:#3a1414;border:1px solid #a34444;color:#ffb3b3;padding:12px 16px;border-radius:10px;font:12px/1.5 monospace;max-width:85%;white-space:pre-wrap}
button{touch-action:manipulation}

#topbar{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(14,17,22,.92);position:sticky;top:0;z-index:50;backdrop-filter:blur(10px);box-shadow:0 6px 24px rgba(0,0,0,.35);gap:10px}
.tb-left{display:flex;align-items:center;gap:12px;min-width:0}
.logo-ic{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#33578b,#17304f);display:flex;align-items:center;justify-content:center;font-size:17px;border:1px solid #3d557f;box-shadow:0 4px 14px rgba(30,80,160,.28);flex:0 0 34px}
.tb-title{font-weight:800;letter-spacing:1.5px;font-size:13px;background:linear-gradient(90deg,#eaf2ff,#9fc4ee);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-right{display:flex;align-items:center;gap:10px}
.sync{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;color:var(--mut);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:#55606f;transition:background .3s,box-shadow .3s}
.sync.ok i{background:var(--green);box-shadow:0 0 8px rgba(47,217,122,.55)}
.sync.busy i{background:var(--yellow);box-shadow:0 0 8px rgba(247,201,72,.4)}
.sync.err i{background:var(--red);box-shadow:0 0 8px rgba(255,92,92,.4)}
.adbadge{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:10px;border:1px solid rgba(47,217,122,.4);background:rgba(47,217,122,.1);color:#7ce6a8;font-size:11.5px;font-weight:800;white-space:nowrap}

#content{padding:22px;max-width:1440px;width:100%;margin:0 auto;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}

.ph{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;margin-bottom:2px}
h1{font-size:23px;font-weight:800;letter-spacing:-.3px}
.cnt{font-size:12px;background:#22304a;border:1px solid #32456a;color:#a9c7ef;padding:2px 10px;border-radius:12px;vertical-align:middle;margin-left:8px}
.ph-sub{color:var(--mut);font-size:12.5px;margin-top:5px}
.ph-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:2px}
.tabs{display:flex;gap:5px;background:#141a23;border:1px solid var(--line);border-radius:13px;padding:5px}
.tab{padding:9px 18px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--mut);font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;transition:all .2s;white-space:nowrap}
.tab:hover{color:var(--txt)}
.tab.on{color:#fff;background:linear-gradient(90deg,rgba(77,163,255,.26),rgba(77,163,255,.07));border-color:rgba(77,163,255,.4);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.btn{background:linear-gradient(145deg,#3684e6,#2868c9);border:1px solid #3a6cb4;color:#fff;padding:9px 15px;border-radius:10px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;transition:all .18s;box-shadow:0 4px 14px rgba(40,100,190,.25)}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.big{padding:12px 20px;font-size:13px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt);box-shadow:none}
.btn.ghost:hover{border-color:#3a4757;filter:none}
.btn.slim{padding:7px 13px;font-size:11.5px}
.btn.warn{background:linear-gradient(145deg,#a03c3c,#7c2a2a);border-color:#a34444;box-shadow:0 4px 14px rgba(160,60,60,.25)}

.cats{display:flex;gap:10px;margin:16px 0 12px;flex-wrap:wrap}
.cat{display:inline-flex;align-items:center;gap:10px;padding:11px 18px;border-radius:13px;border:1px solid var(--line);background:linear-gradient(145deg,#1c2432,#181e28);font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;color:var(--mut);font-family:inherit;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.cat:hover{border-color:#3a4757;color:var(--txt);transform:translateY(-1px)}
.cat:active{transform:scale(.98)}
.cat.on{border-color:rgba(77,163,255,.5);background:linear-gradient(90deg,rgba(77,163,255,.2),rgba(77,163,255,.05));color:#fff;box-shadow:0 4px 18px rgba(40,100,190,.22)}
.cat-ic{font-size:15px}
.cn{margin-left:4px;background:#232e3d;border:1px solid #32405a;padding:1px 8px;border-radius:10px;font-size:10.5px;color:#aeb9cc;font-style:normal;font-weight:700}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 10px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-size:12.5px;font-weight:700;cursor:pointer;user-select:none;transition:all .18s}
.chip:hover{border-color:var(--cc,var(--acc));color:var(--txt)}
.chip:active{transform:scale(.97)}
.chip.on{border-color:var(--cc,var(--acc));color:#fff;background:var(--ccb,rgba(77,163,255,.18));box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;box-shadow:0 0 8px 1px var(--cc,transparent);transition:box-shadow .25s}

.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0 4px}
.inp,.sel{background:#141a23;border:1px solid var(--line);color:var(--txt);padding:10px 13px;border-radius:10px;font-size:14px;font-family:inherit;outline:none;transition:border-color .18s,box-shadow .18s}
.inp:focus,.sel:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(77,163,255,.14)}
.sel option{background:#141a23}
textarea.inp{resize:vertical}

.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-top:14px}
.vcard{background:linear-gradient(145deg,#1c2432,#181e28);border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative;transition:transform .2s,border-color .2s,box-shadow .2s;box-shadow:inset 0 1px 0 rgba(255,255,255,.03);animation:cardIn .4s both}
@keyframes cardIn{from{opacity:0;transform:translateY(12px) scale(.98)}}
.vcard:hover{border-color:#3a4757;transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.35)}
.vcard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--dc,#4da3ff);z-index:3}
.vph{position:relative;aspect-ratio:16/10;background:#141a23;cursor:pointer;overflow:hidden}
.vph.empty{background:#12161e}
.vph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in;animation:fadeIn .4s}
@keyframes fadeIn{from{opacity:0}}
.vph.drag{outline:2px dashed var(--dc,var(--acc));outline-offset:-5px}
.vph-empty{position:absolute;inset:10px;border:1px dashed #2c3644;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#5b6675;transition:all .2s;text-align:center;padding:6px}
.vph-empty .pe-ic{font-size:25px;opacity:.7}
.vph-empty b{color:#8b95a7;font-size:12px;font-weight:700}
.vph-empty span{font-size:10px}
.vph:hover .vph-empty{border-color:rgba(77,163,255,.5);color:var(--acc)}
.vph:hover .vph-empty b{color:#cfe4ff}
.vph-empty.plain{border-style:solid;border-color:#20262f;cursor:default}
.vph-empty.plain:hover{border-color:#20262f;color:#5b6675}
.vdep{position:absolute;left:8px;top:11px;padding:3px 9px;border-radius:8px;font-size:10px;font-weight:800;letter-spacing:.5px;border:1px solid;background:rgba(14,17,22,.72);backdrop-filter:blur(4px);pointer-events:none}
.vph-tools{position:absolute;top:11px;right:8px;display:flex;gap:6px;opacity:0;transition:opacity .2s;z-index:4}
.vcard:hover .vph-tools{opacity:1}
@media(hover:none){.vph-tools{opacity:1}.vcard:hover{transform:none}}
.vtool{width:28px;height:28px;border-radius:9px;background:rgba(14,17,22,.85);border:1px solid #2e3846;color:#c9d3e3;cursor:pointer;font-size:12px;font-family:inherit;transition:all .15s;backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center}
.vtool:hover{border-color:var(--acc);color:#fff}
.vtool.vtool-del:hover{border-color:var(--red);color:#ffb3b3}
.vbody{padding:12px 14px 14px}
.vname{font-weight:800;font-size:13.5px;line-height:1.35;min-height:18px;border-radius:6px;padding:1px 3px;margin-left:-3px}
.vdesc{font-size:11.5px;color:var(--mut);margin-top:6px;line-height:1.5;min-height:17px;border-radius:6px;padding:1px 3px;margin-left:-3px}
.vsp{display:flex;align-items:baseline;gap:6px;margin-top:10px;padding-top:9px;border-top:1px dashed #232b37}
.vsp .l{color:#5b6675;text-transform:uppercase;letter-spacing:1.1px;font-weight:800;font-size:9px}
.vsp b{margin-left:auto;font-size:14px;font-weight:800;color:var(--dc,#6cc0ff);min-width:14px;text-align:right;border-radius:6px;padding:1px 3px}
.vsp i{font-style:normal;color:var(--mut);font-size:10px;font-weight:700}
[contenteditable]{outline:none}
[contenteditable]:focus{background:#141a23;box-shadow:0 0 0 3px rgba(77,163,255,.14)}
[contenteditable]:empty::before{content:attr(data-ph);color:#4a5462}
.empty{padding:26px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:12px;margin-top:10px}

#lb{position:fixed;inset:0;z-index:600;background:rgba(4,7,11,0);backdrop-filter:blur(0);display:flex;align-items:center;justify-content:center;padding:26px;cursor:zoom-out;opacity:0;transition:opacity .22s,backdrop-filter .22s;pointer-events:none}
#lb.show{opacity:1;background:rgba(4,7,11,.88);backdrop-filter:blur(9px);pointer-events:auto}
#lb img{max-width:min(1150px,92vw);max-height:86vh;border-radius:14px;border:1px solid #2e3846;box-shadow:0 30px 90px rgba(0,0,0,.7);transform:scale(.9);opacity:0;transition:transform .24s ease,opacity .24s ease;cursor:zoom-out}
#lb.zoom img{transform:scale(1);opacity:1}
.lb-cap{position:absolute;top:20px;left:24px;font-weight:800;font-size:14px;color:#e9edf4;background:rgba(14,17,22,.72);border:1px solid #2e3846;padding:9px 15px;border-radius:12px;backdrop-filter:blur(6px);max-width:70vw}
.lb-cap span{display:block;font-weight:600;font-size:11px;color:var(--mut);margin-top:3px}
.lbdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}

.back{position:fixed;inset:0;background:rgba(4,7,11,.75);backdrop-filter:blur(7px);z-index:400;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:34px 14px;animation:fadeIn .2s}
#croot .back{z-index:420}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.modal{width:100%;max-width:820px;background:#161c25;border:1px solid #2b3442;border-radius:20px;box-shadow:0 30px 90px rgba(0,0,0,.6);animation:up .3s;overflow:hidden;display:flex;flex-direction:column;max-height:calc(100vh - 70px)}
.modal.smw{max-width:430px}
.m-head{flex:0 0 auto;padding:22px 24px 16px;border-bottom:1px solid var(--line);position:relative;background:linear-gradient(180deg,rgba(77,163,255,.08),transparent)}
.m-close{position:absolute;top:14px;right:14px;background:#1d2531;border:1px solid var(--line);color:var(--mut);width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:13px;transition:all .15s;font-family:inherit}
.m-close:hover{color:var(--txt);border-color:#3a4757}
.mh-nm{font-size:19px;font-weight:800;letter-spacing:.4px;padding-right:36px}
.mh-sub{font-size:12px;color:var(--mut);margin-top:6px;line-height:1.5;padding-right:36px}
.m-body{flex:1 1 auto;overflow-y:auto;min-height:100px;padding:18px 24px}
.m-foot{flex:0 0 auto;padding:13px 24px;border-top:1px solid var(--line);background:#141a24;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end}
.flab{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mut);font-weight:800;margin:0 0 6px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.formgrid .full{grid-column:1/-1}
.aph{aspect-ratio:16/8;border:1px dashed #2c3644;border-radius:12px;background:#141a23;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .18s;overflow:hidden;position:relative}
.aph:hover{border-color:rgba(77,163,255,.55)}
.aph.drag{border-color:var(--acc);background:#16202c}
.aph-in{display:flex;flex-direction:column;align-items:center;gap:5px;color:#5b6675;text-align:center;padding:6px}
.aph-in .aph-ic{font-size:26px;opacity:.75}
.aph-in b{color:#8b95a7;font-size:12.5px}
.aph-in span{font-size:10.5px}
.aph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hint{font-size:11.5px;color:var(--mut);line-height:1.6;margin-top:10px;background:#141a23;border:1px solid var(--line);border-radius:10px;padding:10px 12px}

#troot{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:700;display:flex;flex-direction:column;gap:8px}
.toast{background:#1c2531;border:1px solid #32435c;border-left:3px solid var(--acc);padding:12px 16px;border-radius:12px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.45);animation:up .3s;max-width:360px;transition:opacity .35s,transform .35s}
.toast.warn{border-left-color:var(--red)}
.toast.out{opacity:0;transform:translateY(8px)}

@media(max-width:760px){
body{font-size:13.5px}
#topbar{height:54px;padding:0 12px}
.logo-ic{width:30px;height:30px;flex-basis:30px;font-size:15px}
.tb-title{font-size:11px;letter-spacing:1px}
.sync span{display:none}
.adbadge{padding:6px 10px;font-size:10.5px}
#content{padding:14px 12px 40px}
.ph{flex-direction:column;gap:12px}
h1{font-size:20px}
.ph-sub{font-size:11.5px}
.ph-actions{width:100%;display:grid;grid-template-columns:1fr;gap:10px}
.tabs{padding:4px}
.tab{flex:1;padding:11px 6px;font-size:12px;text-align:center}
.btn.big{width:100%;padding:14px}
.cats{gap:8px;margin:12px 0 10px}
.cat{flex:1 1 100%;padding:14px 16px;font-size:13px;justify-content:center}
.chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin:10px 0 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;white-space:nowrap}
.ctl .inp{width:100%}
.vgrid{grid-template-columns:repeat(2,1fr);gap:10px}
.vcard{border-radius:14px}
.vph{aspect-ratio:16/11}
.vph-empty{inset:8px}
.vph-empty span{display:none}
.vph-empty b{font-size:11px}
.vtool{width:32px;height:32px;font-size:13px}
.vbody{padding:9px 10px 11px}
.vname{font-size:12.5px}
.vdesc{font-size:10.5px;line-height:1.45}
.vsp b{font-size:12.5px}
.vsp{margin-top:8px;padding-top:7px}
.back{padding:10px;align-items:stretch}
.modal{max-height:calc(100vh - 20px);border-radius:16px}
.m-head{padding:16px 16px 12px}
.mh-nm{font-size:16px}
.m-body{padding:14px 16px}
.m-foot{padding:12px 16px}
.m-foot .btn{flex:1;padding:13px}
.formgrid{grid-template-columns:1fr}
#lb{padding:12px}
#lb img{max-width:96vw;max-height:78vh;border-radius:12px}
.lb-cap{top:12px;left:12px;right:12px;max-width:none;font-size:12px;padding:8px 12px;border-radius:10px}
#troot{right:10px;left:10px;bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.toast{max-width:none}
}
@media(max-width:360px){.vgrid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="errbox"></div>
<script>
window.addEventListener('error',function(ev){
 var b=document.getElementById('errbox');
 if(b){b.style.display='block';b.textContent='Ошибка: '+(ev.message||'неизвестная')+' — проверьте, что файл скопирован целиком';}
},true);
</script>

<header id="topbar">
  <div class="tb-left">
    <div class="logo-ic" id="logoIc">🚔</div>
    <div class="tb-title" id="tbTitle">МВД · АВТОПАРК</div>
  </div>
  <div class="tb-right">
    <div class="sync" id="sync"><i></i><span id="syncTxt">Локально</span></div>
    <div id="adminZone"></div>
  </div>
</header>

<main id="content">
  <div class="ph">
    <div>
      <h1><span id="hTitle">Автопарк</span><span class="cnt" id="cnt">0</span></h1>
      <div class="ph-sub" id="hSub"></div>
    </div>
    <div class="ph-actions">
      <div class="tabs">
        <button class="tab on" data-kind="cars" onclick="setKind('cars')">🚔 Автопарк</button>
        <button class="tab" data-kind="form" onclick="setKind('form')">🎽 Форма</button>
      </div>
      <button class="btn big" id="addBtn" onclick="openAdd()">＋ Добавить машину</button>
    </div>
  </div>

  <div class="cats" id="cats"></div>
  <div class="chips" id="chips"></div>

  <div class="ctl">
    <input class="inp" id="q" placeholder="🔍 Поиск по названию или описанию…">
  </div>

  <div class="vgrid" id="vgrid"></div>
  <div class="empty" id="vempty" style="display:none"></div>
</main>

<input type="file" id="fileInp" accept="image/*" style="display:none">

<div id="lb"><div class="lb-cap" id="lbCap"></div><img id="lbImg" alt=""></div>
<div id="mroot"></div>
<div id="croot"></div>
<div id="troot"></div>

<script>
/* Репозиторий определяется автоматически по адресу сайта */
var REPO=(function(){
 var h=location.hostname,p=location.pathname;
 if(!/\.github\.io$/.test(h)){return null}
 var owner=h.replace(/\.github\.io$/,'');
 var seg=p.split('/').filter(Boolean);
 return owner+'/'+(seg.length?seg[0]:(owner+'.github.io'));
})();
var BRANCH='main';

/* ============ БЕЗОПАСНОЕ ХРАНИЛИЩЕ ============ */
var LS=(function(){
 var mem={},ok=false;
 try{
  var t='__ls_test__';
  window.localStorage.setItem(t,'1');
  window.localStorage.removeItem(t);
  ok=true;
 }catch(e){ok=false}
 return {
  get:function(k){
   if(ok){try{return window.localStorage.getItem(k)}catch(e){}}
   return Object.prototype.hasOwnProperty.call(mem,k)?mem[k]:null;
  },
  set:function(k,v){
   v=String(v);
   if(ok){try{window.localStorage.setItem(k,v);return}catch(e){}}
   mem[k]=v;
  },
  remove:function(k){
   if(ok){try{window.localStorage.removeItem(k);return}catch(e){}}
   delete mem[k];
  }
 };
})();

/* ============ УТИЛИТЫ ============ */
function $(s){return document.querySelector(s)}
function qsa(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function hex2rgba(h,a){var r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return 'rgba('+r+','+g+','+b+','+a+')'}
function toast(msg,warn){var t=document.createElement('div');t.className='toast'+(warn?' warn':'');t.textContent=msg;$('#troot').appendChild(t);setTimeout(function(){t.classList.add('out')},3400);setTimeout(function(){t.remove()},3900)}
function b64e(s){return btoa(unescape(encodeURIComponent(s)))}

function toArr(x){if(!x){return null}if(Array.isArray(x)){return x}var ks=Object.keys(x).sort(function(a,b){return a-b}),arr=[];for(var i=0;i<ks.length;i++){arr[+ks[i]]=x[ks[i]]}return arr}
function loadLocal(){
 var d=null;
 try{ d=JSON.parse(LS.get(LOCAL_K)||'null') }catch(e){}
 if(d&&toArr(d.items)){return toArr(d.items)}
 var map={uvd:'uvd',gibdd:'gibdd',mz:'cgb',mo:'vs',cgb:'cgb',vs:'vs',rzd:'rzd',fsb:'fsb',sk:'sk',prok:'prok',mchs:'mchs',fso:'fso'};
 var oldKeys=['mvd_garage_v3','mvd_garage_v2','mvd_garage_v1'];
 for(var i=0;i<oldKeys.length;i++){
  var o=null;
  try{ o=JSON.parse(LS.get(oldKeys[i])||'null') }catch(e){}
  if(!o){continue}
  var ev={fsb:1,sk:1,prok:1,mchs:1},items=[];
  if(o.items){
   var a=toArr(o.items)||[];
   for(var j=0;j<a.length;j++){ if(map[a[j]&&a[j].dep]){items.push(a[j])} }
  }else if(o.cars){
   var cs=o.cars;
   for(var j2=0;j2<cs.length;j2++){
    var c=cs[j2],nk=map[c.dep];
    if(!nk){continue}
    items.push({id:c.id,kind:'cars',cat:ev[c.dep]?'event':'main',dep:nk,name:c.name,desc:c.desc,speed:c.speed,photo:c.photo||''});
   }
  }
  if(items.length){
   saveLocal(items);
   LS.remove(oldKeys[i]);
   return items;
  }
 }
 return seed();
}

/* ============ СИНХРОНИЗАЦИЯ ЧЕРЕЗ GITHUB ============
   Чтение: два канала —
   · API api.github.com (свежий, без кэша): владелец — каждые 3 сек,
     зрители — примерно раз в минуту (у GitHub лимит для гостей);
   · raw (быстрый, но может отдавать копию до 5 минут) — каждую секунду.
   Если raw отстал — страница сама переключается на API.
   Запись: только владелец, одним коммитом (data.json + rev.txt).    */
function setSync(cls,txt){
 var s=$('#sync');
 s.className='sync '+(cls||'');
 if(txt){$('#syncTxt').textContent=txt}
}
function rawUrl(file,br){return 'https://raw.githubusercontent.com/'+REPO+'/'+(br||BRANCH)+'/'+file+'?v='+Date.now()}
function rawGet(file,br){
 return fetch(rawUrl(file,br),{cache:'no-store'}).then(function(r){
  if(r.status===404){var e=new Error('404');e.nf=true;throw e}
  if(!r.ok){throw new Error(r.status)}
  return r.text();
 });
}
/* содержимое файла напрямую через API (без CDN-кэша) */
function apiText(path,auth){
 var h={Accept:'application/vnd.github.raw'};
 if(auth&&ADMIN_KEY){h.Authorization='token '+ADMIN_KEY}
 return fetch('https://api.github.com/repos/'+REPO+'/contents/'+path+'?t='+Date.now(),{headers:h,cache:'no-store'}).then(function(r){
  if(!r.ok){var e=new Error(r.status);if(r.status===403&&!(auth&&ADMIN_KEY)){e.rl=true}throw e}
  return r.text();
 });
}
/* большой файл (с фото) — через Git Blobs API */
function apiBlobText(sha){
 var h={Accept:'application/vnd.github+json'};
 if(ADMIN_KEY){h.Authorization='token '+ADMIN_KEY}
 return fetch('https://api.github.com/repos/'+REPO+'/git/blobs/'+sha+'?t='+Date.now(),{headers:h,cache:'no-store'}).then(function(r){
  if(!r.ok){var e=new Error(r.status);if(r.status===403&&!ADMIN_KEY){e.rl=true}throw e}
  return r.json();
 }).then(function(j){return b64d(j.content)});
}
function ghHeaders(){return {Authorization:'token '+ADMIN_KEY,Accept:'application/vnd.github+json','Content-Type':'application/json'}}
function ghReq(method,path,body){
 return fetch('https://api.github.com/repos/'+REPO+'/'+path,{
  method:method,headers:ghHeaders(),
  body:body?JSON.stringify(body):undefined
 }).then(function(r){
  if(!r.ok){throw r.status}
  return r.status===204?null:r.json();
 });
}
/* rev.txt: "N" или "N:shaDataJson" */
function parseRevTxt(t){
 t=String(t||'').trim();
 var i=t.indexOf(':');
 if(i<0){return {rev:parseInt(t,10)||0,sha:null}}
 return {rev:parseInt(t.substring(0,i),10)||0,sha:t.substring(i+1).trim()};
}
function checkToken(tok){
 return fetch('https://api.github.com/user',{headers:{Authorization:'token '+tok}})
  .then(function(r){ if(!r.ok){throw r.status} return fetch('https://api.github.com/repos/'+REPO,{headers:{Authorization:'token '+tok}}) })
  .then(function(r){ if(!r.ok){throw r.status} return r.json() })
  .then(function(j){ return !j.permissions||!!j.permissions.push });
}

/* ============ СОХРАНЕНИЕ (очередь, короткий путь) ============ */
var pushTimer=null, pushInFlight=false, dataDirty=false, pushRetries=0, pushToastShown=false;
var lastCommitSha=null, lastTreeSha=null;

function commit(){
 if(!REPO){ saveLocal(ITEMS); return }
 if(!adminMode){ return }
 dataDirty=true;
 LS.set(PENDING_K,String(Date.now()));
 cacheItems();
 if(pushInFlight){ return }
 if(pushTimer){ return }
 pushTimer=setTimeout(doPush,100);          /* уходит почти мгновенно */
}

function doPush(){
 pushTimer=null;
 if(!adminMode||!REPO||pushInFlight||!dataDirty){ return }
 var rev=(typeof localRev==='number'?localRev:0)+1;
 var snapshot=JSON.stringify({rev:rev,items:ITEMS});
 dataDirty=false;
 needSeed=false;
 pushInFlight=true;
 setSync('busy','Сохранение…');
 pendingRev=rev;
 var dataSha=null;
 ghReq('POST','git/blobs',{content:b64e(snapshot),encoding:'base64'}).then(function(b){
  dataSha=b.sha;
  return ghReq('POST','git/blobs',{content:b64e(rev+':'+b.sha),encoding:'base64'});
 }).then(function(bRev){
  var tree=[
   {path:'data.json',mode:'100644',type:'blob',sha:dataSha},
   {path:'rev.txt',mode:'100644',type:'blob',sha:bRev.sha}
  ];
  var base;
  if(lastCommitSha&&lastTreeSha){
   base=Promise.resolve({c:lastCommitSha,t:lastTreeSha});
  }else{
   base=ghReq('GET','git/refs/heads/'+BRANCH).catch(function(code){
    if(code===404&&BRANCH!=='master'){BRANCH='master';return ghReq('GET','git/refs/heads/master')}
    throw code;
   }).then(function(ref){
    return ghReq('GET','git/commits/'+ref.object.sha).then(function(cm){
     return {c:ref.object.sha,t:cm.tree.sha};
    });
   });
  }
  return base.then(function(b){
   return ghReq('POST','git/trees',{base_tree:b.t,tree:tree}).then(function(nt){
    return ghReq('POST','git/commits',{message:'sync: '+rev,tree:nt.sha,parents:[b.c]}).then(function(nc){
     return ghReq('PATCH','git/refs/heads/'+BRANCH,{sha:nc.sha}).then(function(){
      lastCommitSha=nc.sha;lastTreeSha=nt.sha;
     });
    });
   });
  });
 }).then(function(){
  pushInFlight=false;pushRetries=0;pushToastShown=false;
  localRev=rev;pendingRev=null;
  cacheItems();
  LS.remove(PENDING_K);
  setSync('ok','GitHub');
  if(dataDirty){ pushTimer=setTimeout(doPush,150) }
 }).catch(function(code){
  pushInFlight=false;pendingRev=null;dataDirty=true;
  if(code===401){
   setSync('err','Токен недействителен');
   toast('Токен недействителен — войдите заново через 🔒',true);
   return;
  }
  if(code===422&&pushRetries<4){
   pushRetries++;
   lastCommitSha=null;lastTreeSha=null;
   pushTimer=setTimeout(doPush,300);
   return;
  }
  setSync('err','Не сохранено');
  var msg=(code===403)?'GitHub отклонил запись (403) — пересоздайте токен с галочкой repo'
   :(code===404)?'Не найдена ветка/репозиторий (404) — напишите мне'
   :'Не удалось сохранить (ошибка '+code+') — повторю автоматически';
  if(!pushToastShown){ pushToastShown=true; toast(msg,true) }
  pushRetries++;
  pushTimer=setTimeout(doPush,7000);
 });
}

/* ============ ЧТЕНИЕ: ДВА КАНАЛА ============ */
function resolveRev(){
 return apiText('rev.txt',true).catch(function(e){
  if(e&&e.rl){throw e}
  return apiText('rev.txt',false);
 }).catch(function(e){
  if(e&&e.rl){throw e}
  return rawGet('rev.txt').then(function(t){return parseRevTxt(t)});
 }).catch(function(e){
  if(e&&e.nf){return {rev:0,sha:null}}
  throw e;
 });
}
function pullData(rv){
 /* сначала быстрый raw, при отставании кэша — через API */
 return rawGet('data.json').then(function(d){
  var j=null;try{j=JSON.parse(d)}catch(e){}
  var items=toArr(j&&j.items);
  if(!items){throw new Error('bad')}
  if(typeof j.rev!=='number'||j.rev>=rv.rev){
   return {rev:(typeof j.rev==='number')?Math.max(j.rev,rv.rev):rv.rev,items:items};
  }
  throw new Error('stale');
 }).catch(function(){
  if(rv.sha){
   return apiBlobText(rv.sha).then(function(txt){
    var j=JSON.parse(txt);
    return {rev:rv.rev,items:toArr(j.items)||[]};
   });
  }
  return apiText('data.json',!!ADMIN_KEY).then(function(txt){
   var j=JSON.parse(txt);
   return {rev:(typeof j.rev==='number'?j.rev:rv.rev),items:toArr(j.items)||[]};
  });
 });
}
function applyData(rev,items){
 ITEMS=items;localRev=rev;cacheItems();render();
}

/* быстрый канал: raw каждую секунду */
function rawTick(){
 rawGet('rev.txt').then(function(t){
  var rv=parseRevTxt(t);
  if(rv.rev===localRev){setSync('ok','GitHub');return}
  if(rv.rev<pendingRev){return}
  if(rv.rev===pendingRev){return}
  if(rv.rev<localRev){return}                    /* кэш отстал — игнорируем откат */
  if(adminMode&&(dataDirty||pushInFlight)){return}
  setSync('busy','Обновление…');
  return rawGet('data.json').then(function(d){
   var j=null;try{j=JSON.parse(d)}catch(e){}
   var items=toArr(j&&j.items);
   if(items&&(typeof j.rev!=='number'||j.rev>=rv.rev)){
    applyData((typeof j.rev==='number')?Math.max(j.rev,rv.rev):rv.rev,items);
    setSync('ok','GitHub');
   }else{
    apiTick(true);                               /* кэш подвёл — срочно через API */
   }
  });
 }).catch(function(e){
  if(e&&e.nf){setSync('ok','GitHub');return}
  setSync('err','Нет связи');
 });
}

/* надёжный канал: API (для владельца — каждые 3 сек, для гостей — ~раз в минуту) */
var apiQuietUntil=0, nextViewerApi=0;
function apiTick(force){
 var now=Date.now();
 if(now<apiQuietUntil){return}
 if(!ADMIN_KEY){
  if(!force&&now<nextViewerApi){return}
  if(force&&now<nextViewerApi-55000){return}      /* форс не чаще раза в 20 сек */
 }
 apiText('rev.txt',!!ADMIN_KEY).then(function(t){
  if(!ADMIN_KEY){nextViewerApi=now+75000}
  var rv=parseRevTxt(t);
  if(rv.rev<=localRev||rv.rev===pendingRev){setSync('ok','GitHub');return}
  if(adminMode&&(dataDirty||pushInFlight)){return}
  setSync('busy','Обновление…');
  return pullData(rv).then(function(res){
   if(res&&res.items){applyData(res.rev,res.items)}
   setSync('ok','GitHub');
  });
 }).catch(function(e){
  if(e&&e.rl){apiQuietUntil=now+600000;return}   /* лимит гостей — подождём */
 });
}
function startPoll(){
 setInterval(rawTick,1000);
 setInterval(function(){apiTick(false)},3000);
 document.addEventListener('visibilitychange',function(){ if(!document.hidden){rawTick();apiTick(true)} });
}

/* ============ ЗАГРУЗКА СТРАНИЦЫ ============ */
function initRemote(){
 setSync('busy','Подключение…');
 resolveRev().then(function(rv){
  var cache=loadCache();
  var noData=(rv===null||rv.nf||rv.rev===0);
  if(noData){
   /* данных на сервере ещё нет: показываем кэш (правки) или сиды */
   if(cache){
    ITEMS=cache.items;localRev=cache.rev;needSeed=false;
    if(ADMIN_KEY){dataDirty=true}
   }else{ needSeed=true }
   render();setSync('ok','GitHub');startPoll();restoreSession();return;
  }
  if(ADMIN_KEY&&cache&&cache.rev>rv.rev){
   /* локальный снимок опережает сервер (пуш прервали F5) — восстанавливаем и дозапишем */
   ITEMS=cache.items;localRev=cache.rev;needSeed=false;dataDirty=true;
   render();setSync('ok','GitHub');startPoll();restoreSession();return;
  }
  if(cache&&cache.rev===rv.rev){
   ITEMS=cache.items;localRev=rv.rev;needSeed=false;
   render();setSync('ok','GitHub');startPoll();restoreSession();return;
  }
  setSync('busy','Загрузка…');
  pullData(rv).then(function(res){
   if(res&&res.items){ITEMS=res.items;localRev=res.rev;cacheItems();needSeed=false}
   else{needSeed=true}
   render();setSync('ok','GitHub');startPoll();restoreSession();
  }).catch(function(){
   if(cache){ITEMS=cache.items;localRev=cache.rev}
   render();setSync('err','Нет связи');startPoll();restoreSession();
  });
 }).catch(function(){
  var c=loadCache();
  if(c){ITEMS=c.items;localRev=c.rev}
  render();setSync('err','Нет связи');startPoll();restoreSession();
 });
}

function renderTop(){

  : '<button class="btn ghost slim" onclick="askAdmin()">🔒 Вход</button>';
}
function restoreSession(){
 if(!ADMIN_KEY||!REPO){return}
 checkToken(ADMIN_KEY).then(function(ok){
  if(ok){
   adminMode=true;render();
   if(needSeed||dataDirty||LS.get(PENDING_K)){ dataDirty=true;doPush() }
  }
  else{ ADMIN_KEY='';LS.remove(KEY_K) }
 }).catch(function(){});
}
function askAdmin(){
 if(!REPO){

 $('#mroot').innerHTML=
 '<div class="back" onclick="if(event.target===this)closeM()"><div class="modal smw">'+
  '<div class="m-head"><div class="mh-nm" style="font-size:16px">🔒 Вход владельца</div>'+
  '<div class="mh-sub">Введите Personal Access Token — он даёт право изменять данные. Токен сохранится только в этом браузере.</div>'+
  '<button class="m-close" onclick="closeM()">✕</button></div>'+
  '<div class="m-body"><label class="flab">Токен доступа</label>'+
  '<input class="inp" id="fKey" type="password" style="width:100%" placeholder="ghp_..." autocomplete="off">'+
  '<div class="hint">Как создать: GitHub → аватар → <b>Settings</b> → <b>Developer settings</b> → <b>Personal access tokens</b> → <b>Tokens (classic)</b> → <b>Generate new token</b> → поставить галочку <b>repo</b> → Generate → скопировать.</div></div>'+
  '<div class="m-foot"><button class="btn ghost" onclick="closeM()">Отмена</button>'+
  '<button class="btn" onclick="tryLogin()">Войти</button></div>'+
 '</div></div>';

}
function tryLogin(){
 var tok=$('#fKey').value.trim();
 if(!tok){toast('Введите токен',true);return}
 setSync('busy','Проверка…');
 checkToken(tok).then(function(ok){
  if(!ok){setSync('err','Ошибка');toast('Токен без права записи в этот репозиторий',true);return}
  ADMIN_KEY=tok;
  LS.set(KEY_K,tok);

function renderGrid(){
 var list=[],q=state.q.toLowerCase();
 for(var i=0;i<ITEMS.length;i++){

  list.push(it);
 }

  $('#vempty').textContent=any
   ?'По текущему фильтру и запросу ничего не найдено'
   :(state.kind==='cars'?'В этой категории пока нет машин':'В этой категории пока нет формы');
 }else{

/* ============ ФОТО: ВЫБОР И СЖАТИЕ ============ */
var pickMode=null, pickId=null, addPhoto=null;
function pickPhoto(mode,id){
 pickMode=mode;pickId=id;$('#fileInp').value='';$('#fileInp').click();
}
 $('#fileInp').addEventListener('change',function(){
 var f=this.files[0];if(!f){return}
 loadFile(f,pickMode,pickId);
 this.value='';
});
function loadFile(f,mode,id){
 if(!/^image\//.test(f.type)){toast('Это не изображение',true);return}
 if(f.size>15*1024*1024){toast('Файл слишком большой (>15 МБ)',true);return}
 var url=URL.createObjectURL(f),im=new Image();
 im.onload=function(){
  URL.revokeObjectURL(url);
  var data=compress(im);
  if(mode==='add'){addPhoto=data;setAddPrev(data)}
  else{
   var it=byId(id);
   if(it){it.photo=data;commit();renderGrid();toast('Фото загружено')}
  }
 };
 im.onerror=function(){URL.revokeObjectURL(url);toast('Не удалось прочитать файл',true)};
 im.src=url;
}
function compress(im){
 var steps=[[1100,.82],[900,.74],[800,.64],[700,.52]];
 for(var i=0;i<steps.length;i++){
  var k=Math.min(1,steps[i][0]/Math.max(im.width,im.height));
  var c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(im.width*k));
  c.height=Math.max(1,Math.round(im.height*k));
  var ctx=c.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
  ctx.drawImage(im,0,0,c.width,c.height);
  var data=c.toDataURL('image/jpeg',steps[i][1]);
  if(data.length<200*1024||i===steps.length-1){return data}
 }
}

 }
});

vgrid.addEventListener('blur',function(e){
 var t=e.target;
 if(!adminMode||!t.isContentEditable){return}
 var card=t.closest('.vcard');if(!card){return}
 var it=byId(card.dataset.id);if(!it){return}
 var val=t.innerText.replace(/\u00a0/g,' ').trim();
 if(t.classList.contains('vname')){it.name=val}
 else if(t.classList.contains('vdesc')){it.desc=val}
 else if(t.classList.contains('vnum')){it.speed=val}

},true);

  e.preventDefault();e.target.blur();
 }
});
vgrid.addEventListener('paste',function(e){
 if(!e.target.isContentEditable){return}
 e.preventDefault();
 var t=(e.clipboardData||window.clipboardData).getData('text/plain');
 document.execCommand('insertText',false,t);
},true);

vgrid.addEventListener('dragover',function(e){
 if(!adminMode){return}

 qsa('.vph.drag').forEach(function(x){x.classList.remove('drag')});

 if(ph&&card){e.preventDefault();var f=e.dataTransfer.files[0];if(f){loadFile(f,'item',card.dataset.id)}}
});
document.addEventListener('dragover',function(e){e.preventDefault()});
document.addEventListener('drop',function(e){e.preventDefault()});

 $('#q').addEventListener('input',function(){state.q=this.value.trim();renderGrid()});
