<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Предложения · Фракции · Портал</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0e1116;--bg2:#131820;--card:#191f28;--line:#27303d;--txt:#e9edf4;--mut:#8b95a7;--acc:#4da3ff;--green:#2fd97a;--yellow:#f7c948;--red:#ff5c5c;--purple:#a78bfa}
html{color-scheme:dark}
body{background:radial-gradient(1100px 520px at 8% -10%,rgba(45,100,170,.17),transparent 60%),radial-gradient(900px 520px at 115% 115%,rgba(130,90,220,.11),transparent 55%),#0e1116;color:var(--txt);font-family:Inter,system-ui,'Segoe UI',Roboto,sans-serif;font-size:14px;min-height:100vh}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a3342;border-radius:8px;border:2px solid #131820}
::-webkit-scrollbar-thumb:hover{background:#3a4656}
#errbox{display:none;position:fixed;left:12px;top:12px;z-index:990;background:#3a1414;border:1px solid #a34444;color:#ffb3b3;padding:12px 16px;border-radius:10px;font:12px/1.5 monospace;max-width:85%;white-space:pre-wrap}
button{touch-action:manipulation;font-family:inherit}
#topbar{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(14,17,22,.92);position:sticky;top:0;z-index:50;backdrop-filter:blur(10px);box-shadow:0 6px 24px rgba(0,0,0,.35);gap:10px}
.tb-left{display:flex;align-items:center;gap:12px;min-width:0}
.logo-ic{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#6b4bd9,#3a2080);display:flex;align-items:center;justify-content:center;font-size:17px;border:1px solid #7059c9;box-shadow:0 4px 14px rgba(90,60,200,.35);flex:0 0 34px}
.tb-title{font-weight:800;letter-spacing:1.5px;font-size:13px;background:linear-gradient(90deg,#eaf2ff,#b0a6ee);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-right{display:flex;align-items:center;gap:10px}
.sync{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;color:var(--mut);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:#55606f;transition:background .3s,box-shadow .3s}
.sync.ok i{background:var(--green);box-shadow:0 0 8px rgba(47,217,122,.55)}
.sync.busy i{background:var(--yellow);box-shadow:0 0 8px rgba(247,201,72,.4)}
.sync.err i{background:var(--red);box-shadow:0 0 8px rgba(255,92,92,.4)}
.adbadge{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:10px;border:1px solid rgba(47,217,122,.4);background:rgba(47,217,122,.1);color:#7ce6a8;font-size:11.5px;font-weight:800;white-space:nowrap}
#layout{display:flex;min-height:calc(100vh - 60px);max-width:1560px;margin:0 auto;width:100%}
#sidebar{width:270px;flex:0 0 270px;background:linear-gradient(180deg,#131a24,#111720);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto}
.sb-head{font-size:10px;text-transform:uppercase;letter-spacing:1.8px;color:var(--mut);font-weight:800;padding:0 10px 10px}
.sb-group{margin-bottom:3px}
.sb-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:var(--mut);cursor:pointer;font-weight:700;font-size:13px;transition:.15s;border:1px solid transparent;user-select:none}
.sb-item:hover{color:var(--txt);background:#1a212b}
.sb-item.on{color:#fff;background:linear-gradient(90deg,rgba(167,139,250,.22),rgba(167,139,250,.04));border-color:rgba(167,139,250,.4);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.sb-item .sb-ic{font-size:15px;flex:0 0 auto}
.sb-item .sb-n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-item .sb-c{background:#232e3d;border:1px solid #32405a;padding:1px 8px;border-radius:10px;font-size:10.5px;color:#aeb9cc;font-weight:800}
.sb-item.on .sb-c{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.15);color:#fff}
.sb-sub{margin:2px 0 6px 26px;display:flex;flex-direction:column;gap:2px;border-left:1px dashed #2a3342;padding-left:8px}
.sb-subitem{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:9px;color:var(--mut);cursor:pointer;font-weight:600;font-size:12.5px;transition:.15s}
.sb-subitem:hover{color:var(--txt);background:#1a212b}
.sb-subitem.on{color:#fff;background:rgba(167,139,250,.14);border:1px solid rgba(167,139,250,.32)}
.sb-subitem .sb-c{background:#232e3d;border:1px solid #32405a;padding:1px 7px;border-radius:9px;font-size:10px;color:#aeb9cc;font-weight:800;margin-left:auto}
#content{flex:1;padding:24px 26px 60px;min-width:0;display:flex;flex-direction:column}
.ph{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;margin-bottom:20px}
h1{font-size:23px;font-weight:800;letter-spacing:-.3px}
.cnt{font-size:12px;background:#2a2340;border:1px solid #4a3d80;color:#c7b6ff;padding:2px 10px;border-radius:12px;vertical-align:middle;margin-left:8px}
.ph-sub{color:var(--mut);font-size:12.5px;margin-top:6px;line-height:1.5;max-width:720px}
.ph-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{background:linear-gradient(145deg,#3684e6,#2868c9);border:1px solid #3a6cb4;color:#fff;padding:9px 15px;border-radius:10px;font-weight:700;font-size:12.5px;cursor:pointer;transition:all .18s;box-shadow:0 4px 14px rgba(40,100,190,.25)}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.big{padding:12px 20px;font-size:13px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt);box-shadow:none}
.btn.ghost:hover{border-color:#3a4757;filter:none}
.btn.slim{padding:7px 13px;font-size:11.5px}
.btn.warn{background:linear-gradient(145deg,#a03c3c,#7c2a2a);border-color:#a34444;box-shadow:0 4px 14px rgba(160,60,60,.25)}
.btn.green{background:linear-gradient(145deg,#27a860,#1c8149);border-color:#2aa562;box-shadow:0 4px 14px rgba(40,170,95,.25)}
.btn.purple{background:linear-gradient(145deg,#8b5cf6,#6d3fd6);border-color:#8b5cf6;box-shadow:0 4px 14px rgba(139,92,246,.3)}
.suglist{display:flex;flex-direction:column;gap:12px}
.sug{background:linear-gradient(145deg,#1c2432,#181e28);border:1px solid var(--line);border-radius:15px;padding:16px 20px 16px 22px;position:relative;transition:.18s;box-shadow:inset 0 1px 0 rgba(255,255,255,.03);animation:cardIn .35s both}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}}
.sug:hover{border-color:#3a4757;transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.32)}
.sug::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--sc,#a78bfa)}
.sug-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:8px}
.sug-num{font-weight:800;font-size:16px;color:#a78bfa;min-width:32px;flex:0 0 auto;font-variant-numeric:tabular-nums}
.sug-title{font-weight:800;font-size:14.5px;flex:1;line-height:1.35}
.sug-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:11.5px;color:var(--mut)}
.sug-body{font-size:13.5px;line-height:1.6;color:#dbe3f0;white-space:pre-wrap;word-break:break-word}
.sug-body img{max-width:100%;border-radius:10px;margin:8px 0;display:block;border:1px solid #2b3442;cursor:zoom-in}
.sug-body a{color:var(--acc)}
.sug-tools{position:absolute;top:12px;right:12px;display:flex;gap:6px;opacity:0;transition:opacity .18s}
.sug:hover .sug-tools{opacity:1}
@media(hover:none){.sug-tools{opacity:1}}
.stool{width:28px;height:28px;border-radius:8px;background:rgba(14,17,22,.85);border:1px solid #2e3846;color:#c9d3e3;cursor:pointer;font-size:12px;transition:.15s;display:flex;align-items:center;justify-content:center}
.stool:hover{border-color:var(--acc);color:#fff}
.stool.stool-del:hover{border-color:var(--red);color:#ffb3b3}
.status{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:8px;font-size:10.5px;font-weight:800;letter-spacing:.4px;border:1px solid}
.status.new{color:#a9c7ef;border-color:#35507a;background:rgba(77,163,255,.09)}
.status.accepted{color:#7ce6a8;border-color:#1d6a5c;background:rgba(47,217,122,.09)}
.status.rejected{color:#ff8a8a;border-color:#7a2f2f;background:rgba(255,92,92,.09)}
.status.done{color:#c7b6ff;border-color:#4a3d80;background:rgba(167,139,250,.1)}
.func-card{background:linear-gradient(145deg,rgba(139,92,246,.16),rgba(139,92,246,.04)),linear-gradient(145deg,#1c2432,#181e28);border:1px solid rgba(167,139,250,.5);border-radius:16px;padding:20px 22px;position:relative;cursor:pointer;transition:.2s;box-shadow:0 6px 24px rgba(139,92,246,.18),inset 0 1px 0 rgba(255,255,255,.05);animation:cardIn .35s both;overflow:hidden}
.func-card:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(139,92,246,.28),inset 0 1px 0 rgba(255,255,255,.06);border-color:rgba(167,139,250,.75)}
.func-card::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:linear-gradient(180deg,#a78bfa,#6d3fd6)}
.func-card-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.func-card-ic{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#6d3fd6,#3a2080);display:flex;align-items:center;justify-content:center;font-size:22px;border:1px solid #7059c9;flex:0 0 44px;box-shadow:0 4px 14px rgba(90,60,200,.35)}
.func-card-title{font-weight:800;font-size:16px;color:#fff}
.func-card-sub{font-size:11.5px;color:#c7b6ff;margin-top:2px;font-weight:700;letter-spacing:.3px}
.func-card-body{font-size:13.5px;line-height:1.65;color:#dbe3f0;margin-bottom:12px;white-space:pre-wrap;word-break:break-word}
.func-card-body b{color:#fff}
.func-card-cta{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:11px;background:linear-gradient(145deg,#8b5cf6,#6d3fd6);color:#fff;font-weight:800;font-size:13px;border:1px solid #8b5cf6;box-shadow:0 4px 14px rgba(139,92,246,.35)}
.func-card:hover .func-card-cta{filter:brightness(1.12)}
.empty{padding:26px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:12px;margin-top:10px}
.tabs{display:flex;gap:5px;background:#141a23;border:1px solid var(--line);border-radius:13px;padding:5px}
.tab{padding:9px 18px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--mut);font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;transition:all .2s;white-space:nowrap}
.tab:hover{color:var(--txt)}
.tab.on{color:#fff;background:linear-gradient(90deg,rgba(77,163,255,.26),rgba(77,163,255,.07));border-color:rgba(77,163,255,.4);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.cats{display:flex;gap:10px;margin:16px 0 12px;flex-wrap:wrap}
.cat{display:inline-flex;align-items:center;gap:10px;padding:11px 18px;border-radius:13px;border:1px solid var(--line);background:linear-gradient(145deg,#1c2432,#181e28);font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;color:var(--mut);font-family:inherit;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.cat:hover{border-color:#3a4757;color:var(--txt);transform:translateY(-1px)}
.cat.on{border-color:rgba(77,163,255,.5);background:linear-gradient(90deg,rgba(77,163,255,.2),rgba(77,163,255,.05));color:#fff;box-shadow:0 4px 18px rgba(40,100,190,.22)}
.cat-ic{font-size:15px}
.cn{margin-left:4px;background:#232e3d;border:1px solid #32405a;padding:1px 8px;border-radius:10px;font-size:10.5px;color:#aeb9cc;font-style:normal;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 10px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-size:12.5px;font-weight:700;cursor:pointer;user-select:none;transition:all .18s}
.chip:hover{border-color:var(--cc,var(--acc));color:var(--txt)}
.chip.on{border-color:var(--cc,var(--acc));color:#fff;background:var(--ccb,rgba(77,163,255,.18));box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;box-shadow:0 0 8px 1px var(--cc,transparent);transition:box-shadow .25s}
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0 4px}
.inp,.sel,textarea.inp{background:#141a23;border:1px solid var(--line);color:var(--txt);padding:10px 13px;border-radius:10px;font-size:14px;font-family:inherit;outline:none;transition:border-color .18s,box-shadow .18s}
.inp:focus,.sel:focus,textarea.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(77,163,255,.14)}
.sel option{background:#141a23}
textarea.inp{resize:vertical;min-height:120px;line-height:1.6;font-size:13.5px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-top:14px}
.vgrid.grouped{display:block}
.vcard{background:linear-gradient(145deg,#1c2432,#181e28);border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative;transition:transform .2s,border-color .2s,box-shadow .2s,opacity .2s;box-shadow:inset 0 1px 0 rgba(255,255,255,.03);animation:cardIn .4s both}
.vcard:hover{border-color:#3a4757;transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.35)}
.vcard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--dc,#4da3ff);z-index:3}
.vcard.dragging{opacity:.4;transform:scale(.97)}
.vph{position:relative;aspect-ratio:16/10;background:#141a23;cursor:pointer;overflow:hidden}
.vph.empty{background:#12161e}
.vph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.vph.drag{outline:2px dashed var(--dc,var(--acc));outline-offset:-5px}
.vph-empty{position:absolute;inset:10px;border:1px dashed #2c3644;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#5b6675;transition:all .2s;text-align:center;padding:6px}
.vph-empty .pe-ic{font-size:25px;opacity:.7}
.vph-empty b{color:#8b95a7;font-size:12px;font-weight:700}
.vph-empty span{font-size:10px}
.vph:hover .vph-empty{border-color:rgba(77,163,255,.5);color:var(--acc)}
.vph:hover .vph-empty b{color:#cfe4ff}
.vph-empty.plain{border-style:solid;border-color:#20262f;cursor:default}
.vdep{position:absolute;left:8px;top:11px;padding:3px 9px;border-radius:8px;font-size:10px;font-weight:800;letter-spacing:.5px;border:1px solid;background:rgba(14,17,22,.72);backdrop-filter:blur(4px);pointer-events:none}
.vph-tools{position:absolute;top:11px;right:8px;display:flex;gap:6px;opacity:0;transition:opacity .2s;z-index:4}
.vcard:hover .vph-tools{opacity:1}
@media(hover:none){.vph-tools{opacity:1}.vcard:hover{transform:none}}
.vtool{width:28px;height:28px;border-radius:9px;background:rgba(14,17,22,.85);border:1px solid #2e3846;color:#c9d3e3;cursor:pointer;font-size:12px;transition:all .15s;backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center}
.vtool:hover{border-color:var(--acc);color:#fff}
.vtool.vtool-del:hover{border-color:var(--red);color:#ffb3b3}
.vbody{padding:12px 14px 14px}
.vname{font-weight:800;font-size:13.5px;line-height:1.35;min-height:18px;border-radius:6px;padding:1px 3px;margin-left:-3px}
.vdesc{font-size:11.5px;color:var(--mut);margin-top:6px;line-height:1.5;min-height:17px;border-radius:6px;padding:1px 3px;margin-left:-3px}
.vsp{display:flex;align-items:baseline;gap:6px;margin-top:10px;padding-top:9px;border-top:1px dashed #232b37}
.vsp .l{color:#5b6675;text-transform:uppercase;letter-spacing:1.1px;font-weight:800;font-size:9px}
.vsp b{margin-left:auto;font-size:14px;font-weight:800;color:var(--dc,#6cc0ff);min-width:14px;text-align:right;border-radius:6px;padding:1px 3px}
.vsp i{font-style:normal;color:var(--mut);font-size:10px;font-weight:700}
[contenteditable]{outline:none}
[contenteditable]:focus{background:#141a23;box-shadow:0 0 0 3px rgba(77,163,255,.14)}
[contenteditable]:empty::before{content:attr(data-ph);color:#4a5462}
.gsec{margin:0 0 24px;border-radius:14px;padding:10px;transition:background .2s,outline-color .2s;outline:2px dashed transparent;outline-offset:2px}
.gsec.dragover{outline-color:var(--gc,#4da3ff);background:rgba(77,163,255,.05)}
.ghead{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:800;margin-bottom:11px}
.ghead .gd{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.ghead .gline{flex:1;height:1px;background:linear-gradient(90deg,#27303d,transparent)}
.ghint{font-size:10px;color:#5b6675;font-weight:600;letter-spacing:.5px;text-transform:none;white-space:nowrap}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.gempty{min-height:64px;display:flex;align-items:center;justify-content:center;border:1px dashed #232b37;border-radius:12px;color:#5b6675;font-size:12px}
.clsgrid{display:flex;flex-direction:column;gap:8px}
.clsbtn{display:flex;align-items:center;gap:10px;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(145deg,#1c2432,#181e28);color:var(--txt);font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .18s;text-align:left}
.clsbtn:hover{border-color:var(--cc,var(--acc));transform:translateX(3px)}
.clsbtn.on{border-color:var(--cc,var(--acc));background:var(--ccb,rgba(77,163,255,.14));box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.vcard.sk{pointer-events:none;cursor:default}
.vcard.sk::before{display:none}
.skph{aspect-ratio:16/10;background:#161c26;position:relative;overflow:hidden}
.skph::after,.skb::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 25%,rgba(255,255,255,.05) 50%,transparent 75%);transform:translateX(-100%);animation:skmove 1.4s infinite}
@keyframes skmove{to{transform:translateX(100%)}}
.skb{height:11px;border-radius:6px;background:#161c26;margin:10px 14px 0;position:relative;overflow:hidden}
.deplist-head{font-size:10px;text-transform:uppercase;letter-spacing:1.6px;color:var(--mut);font-weight:800;margin:14px 0 6px}
.deplist-head:first-child{margin-top:0}
.deprow{display:flex;align-items:center;gap:8px;padding:5px 0}
.deprow .ddot{width:10px;height:10px;flex:0 0 10px;border-radius:50%;box-shadow:0 0 8px 1px rgba(0,0,0,.3)}
.deprow .dep-name{flex:1;min-width:0;padding:8px 10px;font-size:13px}
.deprow .dep-color{width:34px;height:34px;flex:0 0 34px;padding:2px;border-radius:8px;cursor:pointer;border:1px solid var(--line);background:#141a23}
.deprow .dep-del{width:34px;height:34px;flex:0 0 34px;padding:0;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center}
.deprow .dep-del:hover{background:linear-gradient(145deg,#c04646,#8f2f2f)}
.deprow .dep-cls-btn{flex:0 0 auto;padding:8px 10px;font-size:11.5px;white-space:nowrap}
.newdep{border-top:1px dashed #232b37;padding-top:14px;margin-top:18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.newdep .inp{flex:1 1 160px;min-width:0}
.newdep .sel{flex:0 0 auto;padding:8px 10px}
.aph{aspect-ratio:16/8;border:1px dashed #2c3644;border-radius:12px;background:#141a23;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .18s;overflow:hidden;position:relative}
.aph:hover{border-color:rgba(77,163,255,.55)}
.aph.drag{border-color:var(--acc);background:#16202c}
.aph-in{display:flex;flex-direction:column;align-items:center;gap:5px;color:#5b6675;text-align:center;padding:6px}
.aph-in .aph-ic{font-size:26px;opacity:.75}
.aph-in b{color:#8b95a7;font-size:12.5px}
.aph-in span{font-size:10.5px}
.aph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

var REPO=(function(){
 var h=location.hostname,p=location.pathname;
 if(!/\.github\.io$/.test(h)){return null}
 var owner=h.replace(/\.github\.io$/,'');
 var seg=p.split('/').filter(Boolean);
 return owner+'/'+(seg.length?seg[0]:(owner+'.github.io'));
})();
var BRANCH='main';
var LS=(function(){
 var mem={},ok=false;
 try{var t='__t__';window.localStorage.setItem(t,'1');window.localStorage.removeItem(t);ok=true}catch(e){ok=false}
 return {
  get:function(k){if(ok){try{return window.localStorage.getItem(k)}catch(e){}}return Object.prototype.hasOwnProperty.call(mem,k)?mem[k]:null},
  set:function(k,v){v=String(v);if(ok){try{window.localStorage.setItem(k,v);return}catch(e){}}mem[k]=v},
  remove:function(k){if(ok){try{window.localStorage.removeItem(k);return}catch(e){}}delete mem[k]}
 };
})();
function $(s){return document.querySelector(s)}
function qsa(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function hex2rgba(h,a){var r=parseInt(h.substring(1,3),16);var g=parseInt(h.substring(3,5),16);var b=parseInt(h.substring(5,7),16);return 'rgba('+r+','+g+','+b+','+a+')'}
function b64e(s){return btoa(unescape(encodeURIComponent(s)))}
function b64d(s){return decodeURIComponent(escape(atob(s)))}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtDate(s){if(!s)return '';var p=s.split('-');if(p.length<3)return s;return p[2]+'.'+p[1]+'.'+p[0]}
function toast(msg,warn){var t=document.createElement('div');t.className='toast'+(warn?' warn':'');t.textContent=msg;$('#troot').appendChild(t);setTimeout(function(){t.classList.add('out')},3200);setTimeout(function(){t.remove()},3700)}
function fetchT(url,opts,ms){
 var ctl=null,to=null;
 try{if(typeof AbortController!=='undefined'){ctl=new AbortController()}}catch(e){ctl=null}
 var o={};
 if(opts){for(var k in opts){if(Object.prototype.hasOwnProperty.call(opts,k)){o[k]=opts[k]}}}
 if(ctl){o.signal=ctl.signal;to=setTimeout(function(){try{ctl.abort()}catch(e){}},ms||9000)}
 return fetch(url,o).then(function(r){if(to)clearTimeout(to);return r},function(e){if(to)clearTimeout(to);throw e});
}
var NET_TO_READ=8000,NET_TO_WRITE=20000;
var ADMIN_KEY=LS.get('idea_admin_key')||'';
var adminMode=false;
function setSync(cls,txt){var s=$('#sync');if(s)s.className='sync '+(cls||'');var e=$('#syncTxt');if(txt&&e)e.textContent=txt}

function rawGet(file,br){
 return fetchT(rawUrl(file,br),{cache:'no-store'},NET_TO_READ).then(function(r){
  if(r.status===404){var e=new Error('404');e.nf=true;throw e}
  if(!r.ok){throw new Error(r.status)}
  return r.text();
 });
}
function apiText(path,auth){
 var h={Accept:'application/vnd.github.raw'};
 if(auth&&ADMIN_KEY)h.Authorization='token '+ADMIN_KEY;
 return fetchT('https://api.github.com/repos/'+REPO+'/contents/'+path+'?t='+Date.now(),{headers:h,cache:'no-store'},NET_TO_READ).then(function(r){
  if(!r.ok){var e=new Error(r.status);if(r.status===403&&!(auth&&ADMIN_KEY)){e.rl=true}throw e}
  return r.text();
 });
}
function apiBlobText(sha){
 var h={Accept:'application/vnd.github+json'};
 if(ADMIN_KEY)h.Authorization='token '+ADMIN_KEY;
 return fetchT('https://api.github.com/repos/'+REPO+'/git/blobs/'+sha+'?t='+Date.now(),{headers:h,cache:'no-store'},NET_TO_READ).then(function(r){
  if(!r.ok)throw r.status;
  return r.json();
 }).then(function(j){return b64d(j.content)});
}
function ghHeaders(){return {Authorization:'token '+ADMIN_KEY,Accept:'application/vnd.github+json','Content-Type':'application/json'}}
function ghReq(method,path,body){
 return fetchT('https://api.github.com/repos/'+REPO+'/'+path,{
  method:method,
  headers:ghHeaders(),
  body:body?JSON.stringify(body):undefined
 },NET_TO_WRITE).then(function(r){
  if(!r.ok)throw r.status;
  return r.status===204?null:r.json();
 });
}
function parseRevTxt(t){
 t=String(t||'').trim();
 var i=t.indexOf(':');
 if(i<0)return {rev:parseInt(t,10)||0,sha:null};
 return {rev:parseInt(t.substring(0,i),10)||0,sha:t.substring(i+1).trim()};
}
function checkToken(tok){
 return fetchT('https://api.github.com/user',{headers:{Authorization:'token '+tok}},NET_TO_READ)
  .then(function(r){if(!r.ok)throw r.status;return fetchT('https://api.github.com/repos/'+REPO,{headers:{Authorization:'token '+tok}},NET_TO_READ)})
  .then(function(r){if(!r.ok)throw r.status;return r.json()})
  .then(function(j){return !j.permissions||!!j.permissions.push});
}

function toArr(x){
 if(!x)return null;
 if(Array.isArray(x))return x;
 var ks=Object.keys(x).sort(function(a,b){return +a-+b}),arr=[];
 for(var i=0;i<ks.length;i++)arr[+ks[i]]=x[ks[i]];
 return arr;
}

var pushTimer=null,pushInFlight=false,dataDirty=false,pushRetries=0,pushToastShown=false;
var lastCommitSha=null,lastTreeSha=null;
function commit(){
 if(!REPO){saveLocalItems(ITEMS);return}
 if(!adminMode)return;
 dataDirty=true;LS.set(PENDING_K,String(Date.now()));cacheItems();
 if(pushInFlight||pushTimer)return;

function doPush(){
 pushTimer=null;
 if(!adminMode||!REPO||pushInFlight||!dataDirty)return;
 var rev=(typeof localRev==='number'?localRev:0)+1;
 var snapshot=JSON.stringify({rev:rev,items:ITEMS});
 dataDirty=false;needSeed=false;pushInFlight=true;
 setSync('busy','Сохранение…');
 pendingRev=rev;
 var dataSha=null;
 ghReq('POST','git/blobs',{content:b64e(snapshot),encoding:'base64'}).then(function(b){
  dataSha=b.sha;
  return ghReq('POST','git/blobs',{content:b64e(rev+':'+b.sha),encoding:'base64'});
 }).then(function(bRev){
  var tree=[
   {path:'data.json',mode:'100644',type:'blob',sha:dataSha},
   {path:'rev.txt',mode:'100644',type:'blob',sha:bRev.sha}
  ];
  var base;
  if(lastCommitSha&&lastTreeSha)base=Promise.resolve({c:lastCommitSha,t:lastTreeSha});
  else base=ghReq('GET','git/refs/heads/'+BRANCH).catch(function(code){
    if(code===404&&BRANCH!=='master'){BRANCH='master';return ghReq('GET','git/refs/heads/master')}
    throw code;
   }).then(function(ref){return ghReq('GET','git/commits/'+ref.object.sha).then(function(cm){return {c:ref.object.sha,t:cm.tree.sha}})});
  return base.then(function(b){
   return ghReq('POST','git/trees',{base_tree:b.t,tree:tree}).then(function(nt){
    return ghReq('POST','git/commits',{message:'ideas: '+rev,tree:nt.sha,parents:[b.c]}).then(function(nc){
     return ghReq('PATCH','git/refs/heads/'+BRANCH,{sha:nc.sha}).then(function(){lastCommitSha=nc.sha;lastTreeSha=nt.sha});
    });
   });
  });
 }).then(function(){
  pushInFlight=false;pushRetries=0;pushToastShown=false;
  localRev=rev;pendingRev=null;
  cacheItems();LS.remove(PENDING_K);
  setSync('ok','GitHub');
  if(dataDirty)pushTimer=setTimeout(doPush,180);
 }).catch(function(code){
  pushInFlight=false;pendingRev=null;dataDirty=true;
  if(code===401){setSync('err','Токен недействителен');toast('Токен недействителен — войдите заново',true);return}
  if(code===422&&pushRetries<4){pushRetries++;lastCommitSha=null;lastTreeSha=null;pushTimer=setTimeout(doPush,320);return}
  setSync('err','Не сохранено');
  var msg=(code===403)?'GitHub отклонил запись (403)':(code===404)?'Не найдена ветка/репозиторий (404)':'Не удалось сохранить ('+code+')';
  if(!pushToastShown){pushToastShown=true;toast(msg,true)}
  pushRetries++;
  pushTimer=setTimeout(doPush,7000);
 });
}
function resolveRev(){

 .catch(function(e){
  if(e&&e.nf)return {rev:0,sha:null};
  return apiText('rev.txt',!!ADMIN_KEY).then(function(t){return parseRevTxt(t)})

 });
}
function pullData(rv){
 return rawGet('data.json').then(function(d){
  var j=null;try{j=JSON.parse(d)}catch(e){}
  var items=toArr(j&&j.items);
  if(!items||!items.length)throw new Error('bad');
  return {rev:(typeof j.rev==='number')?Math.max(j.rev,rv.rev):rv.rev, items:items};
 }).catch(function(){
  if(rv.sha){
   return apiBlobText(rv.sha).then(function(txt){
    var j=JSON.parse(txt);
    return {rev:rv.rev, items:toArr(j.items)||[]};
   });
  }
  return apiText('data.json',!!ADMIN_KEY).then(function(txt){
   var j=JSON.parse(txt);
   return {rev:(typeof j.rev==='number'?j.rev:rv.rev), items:toArr(j.items)||[]};
  });
 });
}

 rawGet('rev.txt').then(function(t){

  if(rv.rev<localRev||rv.rev===pendingRev)return;

  setSync('busy','Обновление…');

   var j=null;try{j=JSON.parse(d)}catch(e){}
   var items=toArr(j&&j.items);
   if(items&&items.length){applyData((typeof j.rev==='number')?Math.max(j.rev,rv.rev):rv.rev,items);setSync('ok','GitHub')}
  });
 }).catch(function(e){if(e&&e.nf){setSync('ok','GitHub');return}setSync('err','Нет связи')}).then(done,done);
}

function initRemote(){

 if(cache&&cache.items&&cache.items.length){
  ITEMS=cache.items;localRev=cache.rev;needSeed=false;booted=true;
  render();setSync('busy','Проверка…');
 }else{setSync('busy','Подключение…')}
 resolveRev().then(function(rv){
  var noData=(rv===null||rv.nf||rv.rev===0);
  if(noData){if(!ITEMS.length){ITEMS=seedItems();needSeed=true}finishBoot('ok','GitHub');return}
  if(ITEMS.length&&localRev>=rv.rev){finishBoot('ok','GitHub');return}
  setSync('busy','Загрузка…');
  return pullData(rv).then(function(res){
   if(res&&res.items&&res.items.length){ITEMS=res.items;localRev=res.rev;cacheItems();needSeed=false}
   else if(!ITEMS.length){ITEMS=seedItems();needSeed=true}
   finishBoot('ok','GitHub');
  });
 }).catch(function(){if(!ITEMS.length)ITEMS=loadLocalItems();finishBoot('err','Нет связи')});
}
function finishBoot(cls,txt){

function restoreSession(cb){
 if(!ADMIN_KEY||!REPO){if(cb)cb();return}
 var done=false;
 var finish=function(){if(!done){done=true;if(cb)cb()}};
 var to=setTimeout(finish,6000);
 checkToken(ADMIN_KEY).then(function(ok){
  if(done){clearTimeout(to);return}
  clearTimeout(to);done=true;
  if(ok){adminMode=true;if(needSeed||dataDirty||LS.get(PENDING_K)){dataDirty=true;doPush()}}
  else{ADMIN_KEY='';LS.remove(KEY_K)}

 },function(){clearTimeout(to);finish()});
}

function compressImg(img){
 var steps=[[1100,.82],[900,.74],[800,.64],[700,.52]];
 for(var i=0;i<steps.length;i++){
  var k=Math.min(1,steps[i][0]/Math.max(img.width,img.height));
  var c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(img.width*k));
  c.height=Math.max(1,Math.round(img.height*k));
  var ctx=c.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
  ctx.drawImage(img,0,0,c.width,c.height);
  var d=c.toDataURL('image/jpeg',steps[i][1]);
  if(d.length<200*1024||i===steps.length-1)return d;
 }
}
function uploadImageToGitHub(file,cb){
 if(!REPO||!ADMIN_KEY){toast('Нужен вход владельца',true);return}
 var reader=new FileReader();
 reader.onload=function(ev){
  var url=ev.target.result;
  var im=new Image();
  im.onload=function(){
   var dataUrl=compressImg(im);
   var base64=dataUrl.split(',')[1];
   var fname='images/idea_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)+'.jpg';
   setSync('busy','Загрузка фото…');
   ghReq('PUT','contents/'+fname,{message:'image: '+fname,content:base64,branch:BRANCH}).then(function(res){
    setSync('ok','GitHub');
    var dl=res&&res.content&&res.content.download_url;
    if(!dl)throw new Error('нет URL');
    toast('Фото загружено');
    cb(dl);
   }).catch(function(code){
    setSync('err','Ошибка');
    toast('Не удалось загрузить фото ('+code+')',true);
   });
  };
  im.onerror=function(){toast('Не удалось прочитать изображение',true)};
  im.src=url;
 };
 reader.readAsDataURL(file);
}

function gDoPush(){
 gPushTimer=null;
 if(!adminMode||!REPO||gPushInFlight||!gDataDirty)return;
 var rev=(typeof gLocalRev==='number'?gLocalRev:0)+1;
 var snapshot=JSON.stringify({rev:rev,items:GITEMS,deps:G_DEPS});
 gDataDirty=false;gNeedSeed=false;gPushInFlight=true;
 setSync('busy','Сохранение…');
 gPendingRev=rev;
 var dataSha=null;
 ghReq('POST','git/blobs',{content:b64e(snapshot),encoding:'base64'}).then(function(b){
  dataSha=b.sha;
  return ghReq('POST','git/blobs',{content:b64e(rev+':'+b.sha),encoding:'base64'});
 }).then(function(bRev){
  var tree=[
   {path:'garage.json',mode:'100644',type:'blob',sha:dataSha},
   {path:'rev_garage.txt',mode:'100644',type:'blob',sha:bRev.sha}
  ];
  var base;
  if(gLastCommitSha&&gLastTreeSha)base=Promise.resolve({c:gLastCommitSha,t:gLastTreeSha});
  else base=ghReq('GET','git/refs/heads/'+BRANCH).catch(function(code){
    if(code===404&&BRANCH!=='master'){BRANCH='master';return ghReq('GET','git/refs/heads/master')}
    throw code;
   }).then(function(ref){return ghReq('GET','git/commits/'+ref.object.sha).then(function(cm){return {c:ref.object.sha,t:cm.tree.sha}})});
  return base.then(function(b){
   return ghReq('POST','git/trees',{base_tree:b.t,tree:tree}).then(function(nt){
    return ghReq('POST','git/commits',{message:'garage: '+rev,tree:nt.sha,parents:[b.c]}).then(function(nc){
     return ghReq('PATCH','git/refs/heads/'+BRANCH,{sha:nc.sha}).then(function(){gLastCommitSha=nc.sha;gLastTreeSha=nt.sha});
    });
   });
  });
 }).then(function(){
  gPushInFlight=false;gPushRetries=0;gPushToastShown=false;
  gLocalRev=rev;gPendingRev=null;
  gCacheItems();LS.remove(G_PENDING_K);
  setSync('ok','GitHub');
  if(gDataDirty)gPushTimer=setTimeout(gDoPush,180);
 }).catch(function(code){
  gPushInFlight=false;gPendingRev=null;gDataDirty=true;
  if(code===401){setSync('err','Токен недействителен');toast('Токен недействителен',true);return}
  if(code===422&&gPushRetries<4){gPushRetries++;gLastCommitSha=null;gLastTreeSha=null;gPushTimer=setTimeout(gDoPush,320);return}
  setSync('err','Не сохранено');
  if(!gPushToastShown){gPushToastShown=true;toast('Не удалось сохранить ('+code+')',true)}
  gPushRetries++;gPushTimer=setTimeout(gDoPush,7000);
 });
}

function gCompress(im){
 var steps=[[1100,.82],[900,.74],[800,.64],[700,.52]];
 for(var i=0;i<steps.length;i++){
  var k=Math.min(1,steps[i][0]/Math.max(im.width,im.height));
  var c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(im.width*k));
  c.height=Math.max(1,Math.round(im.height*k));
  var ctx=c.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
  ctx.drawImage(im,0,0,c.width,c.height);
  var data=c.toDataURL('image/jpeg',steps[i][1]);
  if(data.length<200*1024||i===steps.length-1)return data;
 }
}

gGrid.addEventListener('blur',function(e){
 var t=e.target;
 if(!adminMode||!t.isContentEditable)return;
 var card=t.closest('.vcard');if(!card)return;
 var it=gBy(card.dataset.id);if(!it)return;
 var val=t.innerText.replace(/\u00a0/g,' ').trim();
 if(t.classList.contains('vname'))it.name=val;
 else if(t.classList.contains('vdesc'))it.desc=val;
 else if(t.classList.contains('vnum'))it.speed=val;
 if(!t.innerText.trim())t.innerHTML='';
 gCommit();
},true);
gGrid.addEventListener('keydown',function(e){
 if(e.key==='Enter'&&e.target.classList&&(e.target.classList.contains('vname')||e.target.classList.contains('vnum'))){e.preventDefault();e.target.blur()}
});
gGrid.addEventListener('paste',function(e){
 if(!e.target.isContentEditable)return;
 e.preventDefault();
 var t=(e.clipboardData||window.clipboardData).getData('text/plain');
 document.execCommand('insertText',false,t);
},true);
document.addEventListener('dragover',function(e){e.preventDefault()});
document.addEventListener('drop',function(e){e.preventDefault()});
var gQEl=$('#gQ');
if(gQEl)gQEl.addEventListener('input',function(){if(!gBooted)return;gState.q=this.value.trim();gRenderGrid()});
function gAskOrg(id){
 if(!adminMode)return;
 var it=gBy(id);if(!it)return;
 var cur=it.dep;
 var h='';
 if(!G_DEPS.length)h='<div style="color:#8b95a7;font-size:12.5px">Нет доступных разделов.</div>';
 else for(var i=0;i<G_DEPS.length;i++){
  if(G_DEPS[i].cat!==it.cat)continue;
  h+='<button class="clsbtn'+(G_DEPS[i].k===cur?' on':'')+'" style="--cc:'+G_DEPS[i].c+';--ccb:'+hex2rgba(G_DEPS[i].c,.14)+'" data-gsetorg="'+id+'" data-val="'+G_DEPS[i].k+'"><span class="dot" style="background:'+G_DEPS[i].c+'"></span>'+esc(G_DEPS[i].n)+(G_DEPS[i].k===cur?'<b class="cn" style="margin-left:auto">текущее</b>':'')+'</button>';
 }
 $('#croot').innerHTML='<div class="back" onclick="if(event.target===this)closeC()"><div class="modal smw"><div class="m-head"><div class="mh-nm" style="font-size:16px">Раздел</div><div class="mh-sub">«'+esc(it.name||'Без названия')+'» · '+esc(gCatName(it.kind,it.cat))+'</div><button class="m-close" onclick="closeC()">✕</button></div><div class="m-body"><div class="clsgrid">'+h+'</div></div><div class="m-foot"><button class="btn ghost" onclick="closeC()">Отмена</button></div></div></div>';
}
function gSetOrg(id,dk){
 var it=gBy(id);if(!it){closeC();return}
 if(it.dep===dk){closeC();return}
 var oldName=gDep(it.dep).s;
 it.dep=dk;
 var classes=gClassesOfDep(dk);
 if(classes.length){
  var found=false;
  for(var i=0;i<classes.length;i++)if(classes[i].k===it.cls){found=true;break}
  if(!found)it.cls=classes[0].k;
 }else it.cls='';
 closeC();gCommit();gRender();
 toast('«'+(it.name||'без названия')+'»: '+oldName+' → '+gDep(dk).s);
}
function gAskClass(id){
 if(!adminMode)return;
 var it=gBy(id);if(!it)return;
 var classes=gClassesOfDep(it.dep);
 if(!classes.length){toast('В разделе нет классов',true);return}
 var cur=gClsOf(it);
 var h='';
 for(var i=0;i<classes.length;i++){
  h+='<button class="clsbtn'+(classes[i].k===cur?' on':'')+'" style="--cc:'+classes[i].c+';--ccb:'+hex2rgba(classes[i].c,.14)+'" data-gsetcls="'+id+'" data-val="'+classes[i].k+'"><span class="dot" style="background:'+classes[i].c+'"></span>'+esc(classes[i].n)+(classes[i].k===cur?'<b class="cn" style="margin-left:auto">текущий</b>':'')+'</button>';
 }
 $('#croot').innerHTML='<div class="back" onclick="if(event.target===this)closeC()"><div class="modal smw"><div class="m-head"><div class="mh-nm" style="font-size:16px">Класс машины</div><div class="mh-sub">Раздел «'+esc(gDep(it.dep).n)+'» · «'+esc(it.name||'Без названия')+'»</div><button class="m-close" onclick="closeC()">✕</button></div><div class="m-body"><div class="clsgrid">'+h+'</div></div><div class="m-foot"><button class="btn ghost" onclick="closeC()">Отмена</button></div></div></div>';
}
function gSetCls(id,cls){
 var it=gBy(id);if(!it){closeC();return}
 var oldName=gClassNameOf(it.dep,gClsOf(it));
 it.cls=cls;closeC();gCommit();gRender();
 toast('«'+(it.name||'без названия')+'»: '+oldName+' → '+gClassNameOf(it.dep,cls));
}
document.addEventListener('click',function(e){
 var t=e.target;if(!t||!t.closest)return;
 var el=t.closest('[data-gsetorg]');if(el){gSetOrg(el.getAttribute('data-gsetorg'),el.getAttribute('data-val'));return}
 el=t.closest('[data-gsetcls]');if(el){gSetCls(el.getAttribute('data-gsetcls'),el.getAttribute('data-val'));return}
 el=t.closest('[data-gdepcls]');if(el){gOpenClassesManager(el.getAttribute('data-gdepcls'));return}
 el=t.closest('[data-gclassdel]');if(el){gDeleteClass(gCurrentClassDepK,el.getAttribute('data-gclassdel'));return}
 el=t.closest('[data-gdepdel]');if(el){gDeleteDep(el.getAttribute('data-gdepdel'));return}
 el=t.closest('[data-gdel]');if(el){gDelItem(el.getAttribute('data-gdel'))}
});
var gLbCloseTimer=null;
function gOpenLB(id){
 var it=gBy(id);if(!it||!it.photo)return;
 if(gLbCloseTimer){clearTimeout(gLbCloseTimer);gLbCloseTimer=null}
 var d=gDep(it.dep);
 var sub='<i class="lbdot" style="background:'+d.c+'"></i>'+esc(d.n)+(it.kind==='cars'&&it.speed?' · '+esc(it.speed)+' км/ч':'');
 var img=$('#lbImg');img.setAttribute('src',it.photo);
 $('#lbCap').innerHTML=esc(it.name||'Без названия')+'<span>'+sub+'</span>';
 var lb=$('#lb');lb.classList.add('show');
 requestAnimationFrame(function(){requestAnimationFrame(function(){lb.classList.add('zoom')})});
}
function gSetAddPrev(src){var z=$('#aphIn');if(z)z.innerHTML='<img src="'+src+'">'}
function gFillMDeps(cat,sel){
 var o='';
 for(var i=0;i<G_DEPS.length;i++)if(G_DEPS[i].cat===cat)o+='<option value="'+esc(G_DEPS[i].k)+'">'+esc(G_DEPS[i].n)+'</option>';
 var el=$('#fDep');if(!el)return;
 if(!o)o='<option value="">— нет разделов —</option>';
 el.innerHTML=o;
 if(sel)for(var j=0;j<G_DEPS.length;j++)if(G_DEPS[j].k===sel&&G_DEPS[j].cat===cat){el.value=sel;break}
 gRefreshAddClasses();
}
function gRefreshAddClasses(){
 var fDep=$('#fDep'),fCls=$('#fCls');if(!fCls)return;
 var depKey=fDep?fDep.value:'';
 var classes=gClassesOfDep(depKey);
 var o='';
 if(!classes.length)o='<option value="">— нет классов —</option>';
 else for(var i=0;i<classes.length;i++)o+='<option value="'+esc(classes[i].k)+'">'+esc(classes[i].n)+'</option>';
 fCls.innerHTML=o;
}
function gUpdClsRow(){
 var row=$('#clsRow');if(!row)return;
 var show=(gState.kind==='cars');
 row.style.display=show?'':'none';
 if(show)gRefreshAddClasses();
}
function gOpenAdd(){
 if(!adminMode)return;
 gAddPhoto=null;
 var isCars=gState.kind==='cars';
 var catOpts='';
 var a=G_CATS[gState.kind];
 for(var i=0;i<a.length;i++)catOpts+='<option value="'+a[i].k+'"'+(a[i].k===gState.cat?' selected':'')+'>'+esc(a[i].n)+'</option>';
 $('#mroot').innerHTML=
 '<div class="back" onclick="if(event.target===this)closeM()"><div class="modal" style="max-width:580px">'+
  '<div class="m-head"><div class="mh-nm" style="font-size:17px">'+(isCars?'Новая машина':'Новая форма')+'</div><div class="mh-sub">Заполните карточку</div><button class="m-close" onclick="closeM()">✕</button></div>'+
  '<div class="m-body">'+
  '<div class="aph" id="aph"><div class="aph-in" id="aphIn"><span class="aph-ic">🖼️</span><b>Загрузить фото</b><span>клик или перетащите файл</span></div></div>'+
  '<div class="formgrid" style="margin-top:16px">'+
  '<div><label class="flab">Категория</label><select class="sel" id="fCat" style="width:100%" onchange="gFillMDeps(this.value);gUpdClsRow()">'+catOpts+'</select></div>'+
  '<div><label class="flab">Раздел</label><select class="sel" id="fDep" style="width:100%" onchange="gRefreshAddClasses()"></select></div>'+
  (isCars?'<div id="clsRow"><label class="flab">Класс</label><select class="sel" id="fCls" style="width:100%"></select></div>':'')+
  (isCars?'<div><label class="flab">Макс. скорость, км/ч</label><input class="inp" id="fSp" style="width:100%" placeholder="напр. 180"></div>':'')+
  '<div class="full"><label class="flab">Название</label><input class="inp" id="fName" style="width:100%" placeholder="'+(isCars?'напр. Lada Vesta · ДПС':'напр. Летняя форма')+'"></div>'+
  '<div class="full"><label class="flab">Описание</label><textarea class="inp" id="fDesc" rows="3" style="width:100%"></textarea></div>'+
  '</div></div>'+
  '<div class="m-foot"><button class="btn ghost" onclick="closeM()">Отмена</button><button class="btn" onclick="gSubmitAdd()">'+(isCars?'Добавить машину':'Добавить форму')+'</button></div>'+
 '</div></div>';
 gFillMDeps(gState.cat,gState.dep);
 gUpdClsRow();
 var aph=$('#aph');
 if(aph){
  aph.addEventListener('click',function(e){if(e.target.tagName!=='IMG')gPickPhoto('add',null)});
  aph.addEventListener('dragover',function(e){e.preventDefault();aph.classList.add('drag')});
  aph.addEventListener('dragleave',function(){aph.classList.remove('drag')});
  aph.addEventListener('drop',function(e){e.preventDefault();aph.classList.remove('drag');var f=e.dataTransfer.files[0];if(f)gLoadFile(f,'add',null)});
 }
 setTimeout(function(){var n=$('#fName');if(n)n.focus()},60);
}
function gSubmitAdd(){
 if(!adminMode)return;
 var nameEl=$('#fName');
 var name=nameEl?nameEl.value.trim():'';
 if(!name){toast(gState.kind==='cars'?'Введите название машины':'Введите название формы',true);if(nameEl)nameEl.focus();return}
 var fCat=$('#fCat'),fDep=$('#fDep'),fCls=$('#fCls'),fDesc=$('#fDesc'),fSp=$('#fSp');
 var depVal=fDep?fDep.value:'';
 if(!depVal){
  var firstDep=null;
  for(var i=0;i<G_DEPS.length;i++)if(G_DEPS[i].cat===(fCat?fCat.value:'main')){firstDep=G_DEPS[i];break}
  if(firstDep)depVal=firstDep.k;
 }
 var clsVal=fCls?fCls.value:'';
 if(!gClassesOfDep(depVal).length)clsVal='';
 GITEMS.unshift({id:'n'+Date.now()+Math.floor(Math.random()*999),kind:gState.kind,cat:fCat?fCat.value:'main',dep:depVal,cls:clsVal,name:name,desc:fDesc?fDesc.value.trim():'',speed:gState.kind==='cars'&&fSp?fSp.value.trim():'',photo:gAddPhoto||''});
 if(fCat)gState.cat=fCat.value;
 if(depVal)gState.dep=depVal;
 closeM();gCommit();gRender();
 toast(gState.kind==='cars'?'Машина добавлена: «'+name+'»':'Форма добавлена: «'+name+'»');
}
var G_DEP_PALETTE=['#4da3ff','#56ccff','#ff5c5c','#2fd97a','#ff9a3d','#818cf8','#e05c82','#f7c948','#ff8a52','#c084fc','#7dd3fc','#a78bfa','#f472b6','#34d399','#fbbf24'];
var gCurrentClassDepK=null;
function gOpenDepsManager(){if(!adminMode)return;gRenderDepsModal()}
function gRenderDepsModal(){
 var mainRows='',eventRows='';
 for(var i=0;i<G_DEPS.length;i++){
  var row=gDepRowHtml(G_DEPS[i]);
  if(G_DEPS[i].cat==='event')eventRows+=row;else mainRows+=row;
 }
 var h='<div class="deplist-head">Основной список</div><div>'+(mainRows||'<div style="color:#5b6675;font-size:12px;padding:6px 0">Пока нет разделов</div>')+'</div><div class="deplist-head">Для мероприятий</div><div>'+(eventRows||'<div style="color:#5b6675;font-size:12px;padding:6px 0">Пока нет разделов</div>')+'</div><div class="newdep"><input class="inp" id="gNewDepName" type="text" maxlength="40" placeholder="Название нового раздела"><select class="sel" id="gNewDepCat"><option value="main">Основной</option><option value="event">Мероприятия</option></select><button class="btn" onclick="gAddDepFromModal()">＋ Добавить</button></div>';
 $('#croot').innerHTML='<div class="back" onclick="if(event.target===this)closeC()"><div class="modal" style="max-width:560px"><div class="m-head"><div class="mh-nm" style="font-size:17px">⚙️ Разделы</div><div class="mh-sub">Кнопка 📋 открывает классы внутри раздела.</div><button class="m-close" onclick="closeC()">✕</button></div><div class="m-body">'+h+'</div><div class="m-foot"><button class="btn ghost" onclick="closeC()">Готово</button></div></div></div>';
 setTimeout(function(){var n=$('#gNewDepName');if(n)n.focus()},60);
}
function gDepRowHtml(d){
 var cc=(d.classes&&d.classes.length)?d.classes.length:0;
 return '<div class="deprow" data-gdepk="'+esc(d.k)+'"><span class="ddot" style="background:'+d.c+'"></span><input class="inp dep-name gdep-name" type="text" maxlength="40" data-gdepk="'+esc(d.k)+'" value="'+esc(d.n)+'" placeholder="Название"><input class="dep-color gdep-color" type="color" data-gdepk="'+esc(d.k)+'" value="'+d.c+'"><button class="btn ghost slim dep-cls-btn" data-gdepcls="'+esc(d.k)+'">📋 '+cc+'</button><button class="btn warn slim dep-del" data-gdepdel="'+esc(d.k)+'">✕</button></div>';
}
function gAddDepFromModal(){
 if(!adminMode)return;
 var nEl=$('#gNewDepName'),cEl=$('#gNewDepCat');
 var name=nEl?nEl.value.trim():'';
 if(!name){toast('Введите название раздела',true);if(nEl)nEl.focus();return}
 var cat=cEl?cEl.value:'main';
 if(cat!=='event')cat='main';
 var lower=name.toLowerCase();
 for(var i=0;i<G_DEPS.length;i++)if(G_DEPS[i].n.toLowerCase()===lower&&G_DEPS[i].cat===cat){toast('Такой раздел уже есть',true);return}
 var k='dep_'+Date.now().toString(36)+Math.floor(Math.random()*99);
 var c=G_DEP_PALETTE[G_DEPS.length%G_DEP_PALETTE.length];
 G_DEPS.push({k:k,s:name,n:name,c:c,cat:cat,classes:[]});
 gCommit();gRender();gRenderDepsModal();
 toast('Раздел добавлен: «'+name+'»');
}
function gDeleteDep(k){
 if(!adminMode)return;
 var d=gFindDep(k);if(!d)return;
 var used=gCountDepUsage(k);
 if(used>0){toast('В разделе «'+d.n+'» '+used+' карточек',true);return}
 if(!confirm('Удалить раздел «'+d.n+'»?'))return;
 for(var i=0;i<G_DEPS.length;i++)if(G_DEPS[i].k===k){G_DEPS.splice(i,1);break}
 gCommit();gRender();gRenderDepsModal();toast('Раздел удалён');
}
function gOpenClassesManager(depKey){
 if(!adminMode)return;
 var d=gFindDep(depKey);if(!d){toast('Раздел не найден',true);return}
 gCurrentClassDepK=depKey;gRenderClassesModal();
}
function gRenderClassesModal(){
 var d=gFindDep(gCurrentClassDepK);
 if(!d){gOpenDepsManager();return}
 var rows='';
 for(var i=0;i<d.classes.length;i++)rows+=gClassRowHtml(d.classes[i]);
 if(!rows)rows='<div style="color:#5b6675;font-size:12px;padding:6px 0">Пока нет классов</div>';
 var h='<div class="deplist-head">Классы раздела «'+esc(d.n)+'»</div><div>'+rows+'</div><div class="newdep"><input class="inp" id="gNewClassName" type="text" maxlength="40" placeholder="Название нового класса"><button class="btn" onclick="gAddClassFromModal()">＋ Добавить</button></div>';
 $('#croot').innerHTML='<div class="back" onclick="if(event.target===this)closeC()"><div class="modal" style="max-width:520px"><div class="m-head"><div class="mh-nm" style="font-size:17px">📋 Классы · '+esc(d.n)+'</div><button class="m-close" onclick="closeC()">✕</button></div><div class="m-body">'+h+'</div><div class="m-foot"><button class="btn ghost" onclick="gOpenDepsManager()">← К разделам</button><button class="btn" onclick="closeC()">Готово</button></div></div></div>';
 setTimeout(function(){var n=$('#gNewClassName');if(n)n.focus()},60);
}
function gClassRowHtml(c){
 return '<div class="deprow" data-gclsk="'+esc(c.k)+'"><span class="ddot" style="background:'+c.c+'"></span><input class="inp dep-name gclass-name" type="text" maxlength="40" data-gclsk="'+esc(c.k)+'" value="'+esc(c.n)+'"><input class="dep-color gclass-color" type="color" data-gclsk="'+esc(c.k)+'" value="'+c.c+'"><button class="btn warn slim dep-del" data-gclassdel="'+esc(c.k)+'">✕</button></div>';
}
function gAddClassFromModal(){
 if(!adminMode)return;
 var d=gFindDep(gCurrentClassDepK);if(!d)return;
 var nEl=$('#gNewClassName');
 var name=nEl?nEl.value.trim():'';
 if(!name){toast('Введите название класса',true);if(nEl)nEl.focus();return}
 for(var i=0;i<d.classes.length;i++)if(d.classes[i].n.toLowerCase()===name.toLowerCase()){toast('Такой класс уже есть',true);return}
 var k='cls_'+Date.now().toString(36)+Math.floor(Math.random()*99);
 var c=G_DEP_PALETTE[(d.classes.length+3)%G_DEP_PALETTE.length];
 d.classes.push({k:k,n:name,c:c});
 gCommit();gRender();gRenderClassesModal();
 toast('Класс добавлен: «'+name+'»');
}
function gDeleteClass(depKey,clsKey){
 if(!adminMode)return;
 var d=gFindDep(depKey);if(!d)return;
 var idx=-1,clsObj=null;
 for(var i=0;i<d.classes.length;i++)if(d.classes[i].k===clsKey){idx=i;clsObj=d.classes[i];break}
 if(idx<0)return;
 var used=gCountClassUsage(depKey,clsKey);
 if(used>0){toast('В классе «'+clsObj.n+'» '+used+' карточек',true);return}
 if(!confirm('Удалить класс «'+clsObj.n+'»?'))return;
 d.classes.splice(idx,1);
 gCommit();gRender();gRenderClassesModal();toast('Класс удалён');
}
document.addEventListener('change',function(e){
 var t=e.target;if(!t||!t.getAttribute)return;
 var ck=t.getAttribute('data-gclsk');
 if(ck){
  var d=gFindDep(gCurrentClassDepK);if(!d)return;
  var c=null;for(var i=0;i<d.classes.length;i++)if(d.classes[i].k===ck){c=d.classes[i];break}
  if(!c)return;
  if(t.classList&&t.classList.contains('gclass-name')){var v=t.value.trim();if(!v){t.value=c.n;return}if(v===c.n)return;c.n=v;gCommit();gRender()}
  else if(t.classList&&t.classList.contains('gclass-color')){var cv=t.value;if(!/^#[0-9a-fA-F]{6}$/.test(cv))return;c.c=cv;var row=t.closest('.deprow');if(row){var dot=row.querySelector('.ddot');if(dot){dot.style.background=cv;dot.style.boxShadow='0 0 8px 1px '+cv+'66'}}gCommit();gRender()}
  return;
 }
 var k=t.getAttribute('data-gdepk');if(!k)return;
 var dd=gFindDep(k);if(!dd)return;
 if(t.classList&&t.classList.contains('gdep-name')){var v2=t.value.trim();if(!v2){t.value=dd.n;return}if(v2===dd.n)return;dd.n=v2;dd.s=v2;gCommit();gRender()}
 else if(t.classList&&t.classList.contains('gdep-color')){var cv2=t.value;if(!/^#[0-9a-fA-F]{6}$/.test(cv2))return;dd.c=cv2;var row2=t.closest('.deprow');if(row2){var dot2=row2.querySelector('.ddot');if(dot2){dot2.style.background=cv2;dot2.style.boxShadow='0 0 8px 1px '+cv2+'66'}}gCommit();gRender()}
});
function gAskDel(id){
 if(!adminMode)return;
 var it=gBy(id);if(!it)return;
 var d=gDep(it.dep);
 var clsLine='';
 if(gClassesOfDep(it.dep).length)clsLine='<br>Класс: '+esc(gClassNameOf(it.dep,gClsOf(it)));
 var info='<i class="lbdot" style="background:'+d.c+'"></i>'+esc(d.n)+(it.kind==='cars'&&it.speed?' · '+esc(it.speed)+' км/ч':'')+clsLine;
 $('#croot').innerHTML='<div class="back" onclick="if(event.target===this)closeC()"><div class="modal smw"><div class="m-head"><div class="mh-nm" style="font-size:16px">Удалить карточку?</div><div class="mh-sub">«'+esc(it.name||'Без названия')+'»<br>'+info+'</div></div><div class="m-foot" style="justify-content:flex-end"><button class="btn ghost" onclick="closeC()">Отмена</button><button class="btn warn" data-gdel="'+id+'">Удалить</button></div></div></div>';
}
function gDelItem(id){
 if(!adminMode)return;
 for(var i=0;i<GITEMS.length;i++)if(GITEMS[i].id===id){GITEMS.splice(i,1);break}
 closeC();gCommit();gRender();toast('Карточка удалена');
}
(function(){
 var inp=$('#fileInp');
 inp.addEventListener('change',function(){
  var f=this.files[0];
  if(!f){return}
  if(gPickMode){gLoadFile(f,gPickMode,gPickId);gPickMode=null;gPickId=null}
  this.value='';
 });
})();
document.addEventListener('keydown',function(e){
 if(e.key==='Enter'&&e.target){
  if(e.target.id==='gNewDepName'){e.preventDefault();gAddDepFromModal();return}
  if(e.target.id==='gNewClassName'){e.preventDefault();gAddClassFromModal();return}
 }
});
/* ===================== СТАРТ ===================== */
if(REPO){initRemote()}else{ITEMS=loadLocalItems();booted=true;render();setSync('','Локально')}
</script>
</body>
</html>
